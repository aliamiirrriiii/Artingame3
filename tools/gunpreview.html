<!doctype html>
<html><head><meta charset="utf-8"><title>gun preview</title><link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#101216;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#tags{position:fixed;inset:0;pointer-events:none;font:11px/1.3 monospace;color:#9aa3ab}
#tags div{position:absolute;transform:translate(-50%,0);text-align:center}
#tags b{color:#e6ebef;display:block;font-size:12px;letter-spacing:.1em}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas><div id="tags"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { MaterialLibrary } from '../src/world/materials.js';
import { buildWeapon, triangleCount } from '../src/weapons/gunsmith.js';
import { Viewmodel } from '../src/weapons/viewmodel.js';
import { WEAPONS } from '../src/weapons/arsenal.js';

/**
 * Renders every weapon the gunsmith can build, laid out in a grid and lit like
 * a product shot.
 *
 *   ?ads=rifle            hold one weapon exactly as aiming does, from the eye,
 *                         with a centre reticle drawn over it — the only way to
 *                         see whether the irons actually land on the crosshair.
 *   ?anim=1               headless: equip every weapon in turn through the real
 *                         Viewmodel, fire it, reload it, spin and charge it, and
 *                         check its moving parts actually moved.
 *
 * A triangle count cannot tell you that a magazine is inside the trigger guard
 * or that a scope is mounted upside down. Looking at all twelve at once, at the
 * same scale, is the only way to catch a silhouette that is subtly wrong.
 *
 *   ?only=rifle,shotgun   preview a subset
 *   ?view=1               side elevation instead of three-quarter
 */
const report = { errors: [], weapons: [] };
window.__smoke = report;
addEventListener('error', e => report.errors.push('window: ' + e.message));
addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

const q = new URLSearchParams(location.search);
const only = q.get('only') ? q.get('only').split(',') : null;
const IDS = Object.keys(WEAPONS).filter((id) => !only || only.includes(id));

(async () => {
try {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  const W = Number(q.get('w') || 1600), H = Number(q.get('h') || 900);
  renderer.setSize(W, H, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x101216);

  const assets = new AssetManager(renderer);
  // Paths in the manifest are relative to the site root, not to tools/.
  const manifest = JSON.parse(JSON.stringify(MANIFEST));
  for (const list of Object.values(manifest)) for (const e of list) e.url = '../' + e.url;
  await assets.loadAll(manifest, { anisotropy: 8 });

  // A neutral studio box, not one of the game's HDRIs: the quarry sky the menu
  // uses is sand-coloured, and it made every steel part in here look khaki.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = Number(q.get('env') ?? 0.9);
  // A key, a rim and a soft fill: enough to read a chamfer.
  // Neutral white, so a finish that looks khaki here really is khaki.
  const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(2, 4, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-3, 1.5, -2.5); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));

  const mats = new MaterialLibrary(assets);
  mats.setEnvironment?.(scene.environment);

  // Mechanism check. The bot smoke run cannot reach the wall-buy weapons, so
  // this drives every one of them through the real Viewmodel and asserts that
  // the slide, bolt, pump, cylinder, magazine and rotor each move when they are
  // supposed to. A gun whose action is welded shut still renders perfectly.
  if (q.get('anim') === '1') {
    const stage = { camera: new THREE.PerspectiveCamera(75, W / H, 0.01, 100) };
    const vm = new Viewmodel(stage, mats, null);
    const player = { bobPhase: 0, bobAmount: 0.4, sprinting: false, pos: new THREE.Vector3() };
    const input = { mouse: { dx: 0, dy: 0 } };
    const step = (n, opts) => { for (let i = 0; i < n; i++) vm.update(1 / 60, player, input, opts); };

    for (const id of Object.keys(WEAPONS)) {
      const spec = WEAPONS[id];
      vm.equip(spec);
      const parts = vm.parts;
      const rest = {};
      for (const [k, v] of Object.entries(parts)) rest[k] = v.position.clone();
      const moved = new Set();
      const watch = () => {
        for (const [k, v] of Object.entries(parts)) {
          if (v.position.distanceTo(rest[k]) > 1e-5 || Math.abs(v.rotation.z) > 1e-4) moved.add(k);
        }
      };

      vm.punch(1);
      for (let i = 0; i < 24; i++) { step(1); watch(); }
      vm.startReload(1.2);
      for (let i = 0; i < 80; i++) { step(1); watch(); }
      vm.setSpin(30); vm.setCharge(1);
      for (let i = 0; i < 20; i++) { step(1); watch(); }
      vm.setSpin(0); vm.setCharge(0);
      step(10, { ads: true, adsAmount: 1 });

      const animatable = Object.keys(parts).filter((k) => k !== 'body' && k !== 'reticle' && k !== 'pilot' && k !== 'core');
      const still = animatable.filter((k) => !moved.has(k));
      report.weapons.push({ id, parts: Object.keys(parts), moved: [...moved], still });
      if (still.length) report.errors.push(`${id}: ${still.join(',')} never moved`);
    }
    vm.dispose();
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  // Sighting check: reproduce the viewmodel's aimed pose and look down it.
  const ads = q.get('ads');
  if (ads && WEAPONS[ads]) {
    const g = buildWeapon(WEAPONS[ads], mats);
    const rig = new THREE.Group();
    rig.add(g);
    rig.position.set(0, -(g.userData.sightY ?? 0.02),
      -Math.min(0.40, Math.max(0.22, 0.12 + (g.userData.rear ?? 0.10))));
    scene.add(rig);
    const cam = new THREE.PerspectiveCamera(75, W / H, 0.01, 40);
    const mark = document.createElement('div');
    mark.style.cssText = 'position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;'
      + 'border:0;background:'
      + 'linear-gradient(#e33,#e33) 50% 0/1px 8px no-repeat,'
      + 'linear-gradient(#e33,#e33) 50% 100%/1px 8px no-repeat,'
      + 'linear-gradient(#e33,#e33) 0 50%/8px 1px no-repeat,'
      + 'linear-gradient(#e33,#e33) 100% 50%/8px 1px no-repeat';
    document.body.appendChild(mark);
    renderer.render(scene, cam);
    report.weapons.push({ id: ads, sightY: g.userData.sightY, rear: g.userData.rear,
      adsZ: rig.position.z, muzzle: g.userData.muzzle.toArray() });
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  const cols = Math.min(4, IDS.length);
  const rows = Math.ceil(IDS.length / cols);
  const CELL = 0.90;
  const ROW = Number(q.get('row') || 1.05);
  const tags = document.getElementById('tags');
  const camera = new THREE.PerspectiveCamera(28, W / H, 0.05, 40);

  const bounds = new THREE.Box3();
  IDS.forEach((id, i) => {
    const spec = WEAPONS[id];
    const g = buildWeapon(spec, mats);
    const tris = triangleCount(g);
    report.weapons.push({ id, type: spec.model.type, tris, parts: Object.keys(g.userData.parts) });

    // Centre each weapon in its cell and scale it to a common length, so a
    // pistol and a railgun can be compared on detail rather than on size.
    const box = new THREE.Box3().setFromObject(g);
    const size = box.getSize(new THREE.Vector3());
    const centre = box.getCenter(new THREE.Vector3());
    const holder = new THREE.Group();
    const s = (CELL * 0.78) / Math.max(size.x, size.y, size.z);
    g.position.set(-centre.x * s, -centre.y * s, -centre.z * s);
    g.scale.setScalar(s);
    holder.add(g);
    const cx = (i % cols - (cols - 1) / 2) * CELL;
    const cy = -(Math.floor(i / cols) - (rows - 1) / 2) * CELL * ROW;
    holder.position.set(cx, cy, 0);
    holder.rotation.set(q.get('view') === '1' ? 0 : 0.30, q.get('view') === '1' ? Math.PI / 2 : 2.15, 0);
    scene.add(holder);
    bounds.expandByPoint(new THREE.Vector3(cx, cy, 0));

    const t = document.createElement('div');
    t.innerHTML = `<b>${spec.short}</b>${Math.round(tris)} tris · ${Object.keys(g.userData.parts).join(' ')}`;
    tags.appendChild(t);
    holder.userData.tag = t;
  });

  camera.position.set(0, 0, Math.max(cols * CELL * 1.62, rows * CELL * ROW * 2.1));
  camera.lookAt(0, 0, 0);

  const place = () => {
    const v = new THREE.Vector3();
    for (const o of scene.children) {
      if (!o.userData.tag) continue;
      v.copy(o.position).project(camera);
      o.userData.tag.style.left = `${(v.x * 0.5 + 0.5) * 100}%`;
      o.userData.tag.style.top = `${(-v.y * 0.5 + 0.5) * 100 + 8}%`;
    }
  };

  renderer.render(scene, camera);
  place();
  report.ok = report.errors.length === 0;
  report.done = true;
} catch (err) {
  report.errors.push(String(err && err.stack || err));
  report.ok = false;
  report.done = true;
}
})();
</script>
</body></html>
