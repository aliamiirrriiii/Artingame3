org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Release signing is optional. Supply these (in ~/.gradle/gradle.properties, or
# with -P on the command line) to get a signed release APK; without them
# `assembleRelease` produces an unsigned APK and `assembleDebug` is the one you
# can install directly.
# NOTR_STORE_FILE=/absolute/path/to/keystore.jks
# NOTR_STORE_PASSWORD=
# NOTR_KEY_ALIAS=
# NOTR_KEY_PASSWORD=
