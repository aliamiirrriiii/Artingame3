name: Build Android APK

# The APK cannot be built in the authoring sandbox: dl.google.com and
# maven.google.com are blocked there, and the Android Gradle Plugin is only
# published on Google's Maven repository. A GitHub runner has both the Android
# SDK and network access, so this is where the APK actually gets made.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'vendor/**'
      - 'index.html'
      # The whole of tools/, not just the asset manifest. This job's entire
      # purpose is to run the harnesses in tools/, and it used to ignore changes
      # to them — so a commit that only touched a test never ran that test, and
      # a red suite could look fixed simply because nothing re-ran.
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  # write, not read: the APK job publishes the installable build as a release
  # asset so there is a plain link to it.
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download game assets
        # Zero dependencies — plain node and the built-in fetch.
        run: node tools/fetch-assets.mjs

      - name: Logic tests
        run: |
          npm install --no-audit --no-fund --omit=optional three@0.180.0
          node tools/units.mjs

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        working-directory: android
        # Unsigned unless keystore properties are configured. Not allowed to
        # fail silently: assembleRelease also runs lintVital, which is where a
        # genuinely broken manifest or backup rule shows up.
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK contents
        # Guards against the quiet failure: an APK that builds, installs and
        # launches to a black screen because an asset never made it in.
        run: |
          for APK in $(find android/app/build/outputs/apk -name '*.apk' | sort); do
            node tools/verify-apk.mjs "$APK"
          done

      - name: Report APK size
        run: |
          {
            echo "### APK output"
            for f in $(find android/app/build/outputs/apk -name '*.apk' | sort); do
              printf -- '- `%s` — %s\n' "$f" "$(du -h "$f" | cut -f1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: night-of-the-risen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: night-of-the-risen-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish the APK to a release
        # Actions artifacts can only be fetched by someone signed in to GitHub,
        # from a page, as a zip — which is no use when what you want is to open
        # a link on the phone you are installing on. A release asset is a plain
        # file on a permanent URL, so that is where the installable build goes.
        #
        # The tag is rolling: every build replaces the asset behind the same
        # link rather than leaving a trail of releases to pick through.
        if: github.ref_name == 'claude/ue5-zombie-game-zo0cjg'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" night-of-the-risen.apk
          # Written to a file rather than a shell variable: the notes are
          # multi-line, and a quoted string here would carry this block's YAML
          # indentation into every line of them.
          {
            echo 'Debug build, signed with the Android debug key. Installs'
            echo 'directly on a phone with no signing step.'
            echo
            echo "Commit \`${GITHUB_SHA:0:8}\`, build ${GITHUB_RUN_NUMBER}: $(git log -1 --pretty=%s)"
          } > notes.md
          TITLE="Latest APK (build ${GITHUB_RUN_NUMBER})"
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release edit latest-apk --title "$TITLE" --notes-file notes.md
            gh release upload latest-apk night-of-the-risen.apk --clobber
          else
            gh release create latest-apk night-of-the-risen.apk \
              --title "$TITLE" --notes-file notes.md --prerelease
          fi
          echo "APK: $(gh release view latest-apk --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Headless browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download game assets
        run: node tools/fetch-assets.mjs

      - name: Logic tests
        run: node tools/units.mjs

      - name: Boot and render
        run: node tools/smoke.mjs --viewport 800x450

      - name: Touch controls
        run: node tools/touchtest.mjs

      - name: Zombie hitboxes
        # Spawns one of every archetype and shoots at their bones: head, chest,
        # shin and forearm each have to come back as the part they are, and a
        # severed limb has to stop being shootable. The static-box version of
        # this test could not have failed, which is exactly why it was wrong.
        run: node tools/smoke.mjs --page tools/zombies.html --viewport 960x540

      - name: Corpse physics
        # A body is a solid object from the moment it dies. Throws bodies at a
        # wall and asserts none of them ends up inside it, then kills six on
        # one square metre and asserts the heap is six bodies rather than one
        # drawn six times. With the collision removed this reports both.
        run: node tools/smoke.mjs --page tools/zombies.html --viewport 960x540 --params physics=1

      - name: Blood physics
        # Spray fired at a known wall: nothing may still be in the air
        # afterwards, nothing may land inside the masonry, runners have to
        # descend, repeated bleeding into one place has to make one growing
        # pool rather than six, two pools laid apart have to grow together,
        # and gibs have to stay on this side of the wall.
        run: node tools/smoke.mjs --page tools/blood.html --viewport 1280x720

      - name: Weapon mechanisms
        # Builds all twelve weapons through the real viewmodel and asserts
        # every slide, bolt, pump, cylinder and magazine actually moves. The
        # bot run only ever holds the pistol, so nothing else covers these.
        run: node tools/smoke.mjs --page tools/gunpreview.html --viewport 800x500 --params anim=1

      - name: Hands on every weapon
        # Fits the shared gloves to all twelve and checks the trigger palm
        # lands exactly on each weapon's grip, including when the one weapon
        # that owns its own arms is equipped first.
        run: node tools/smoke.mjs --page tools/gunpreview.html --viewport 800x500 --params hands=1

      - name: Improvised melee weapons
        # The six Poly Haven props: they have to load, align themselves down
        # the view axis, and end up held by the thin end. Getting the last one
        # backwards does not look wrong, it puts the whole weapon behind the
        # camera and leaves a hand holding nothing.
        run: node tools/smoke.mjs --page tools/gunpreview.html --viewport 1920x380 --params 'pose=bat,pan,drill,sign,ukulele,machete,axe,sledge&w=1920&h=380'
