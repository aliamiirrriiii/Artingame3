<script type="module">
import * as THREE from 'three';
import { Stage } from '../src/render/stage.js';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { MaterialLibrary } from '../src/world/materials.js';
import { Level } from '../src/world/level.js';
import { NightSky } from '../src/render/sky.js';
import { Effects } from '../src/render/fx.js';
import { ZombieManager, POSE } from '../src/entities/zombies.js';
import { PRESETS } from '../src/core/quality.js';

const report = { errors: [], steps: [] };
window.__smoke = report;
addEventListener('error', e => report.errors.push('window: ' + e.message));
addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

(async () => {
try {
  const preset = PRESETS[new URLSearchParams(location.search).get('q') || 'medium'];
  const stage = new Stage(document.getElementById('c'), preset);
  stage.resize(960, 540);
  const m = JSON.parse(JSON.stringify(MANIFEST));
  for (const g of ['textures','models','hdri','buffers']) for (const a of m[g]) a.url = '../' + a.url;
  const assets = new AssetManager(stage.renderer);
  await assets.loadAll(m, { anisotropy: preset.anisotropy });
  stage.applyEnvironment(assets.environment('night'), { intensity: 0.7, fog: 0x111823 });
  const sky = new NightSky(stage.scene); sky.matchFog(stage.fogColor); sky.alignToLight(stage.moon);
  const mats = new MaterialLibrary(assets);
  const level = new Level(stage.scene, mats, assets, preset).build();
  const fx = new Effects(stage.scene, assets, preset);
  const zm = new ZombieManager(stage.scene, assets, level, fx, preset);
  report.steps.push('init');

  // A line-up: one of each archetype, spaced out, all walking toward +Z.
  // Out on the north street, clear of the fountain and its colliders.
  const types = ['walker','runner','crawler','brute','spitter','screamer','abomination'];
  types.forEach((t, i) => {
    const z = zm.spawn(t, new THREE.Vector3((i - 3) * 3.4, 0, 30), 1);
    if (z) { z.state = 'pursue'; z.stateT = 1; z.root.position.y = 0; }
  });
  report.spawned = zm.aliveCount;
  report.steps.push('spawn');

  const fakePlayer = { pos: new THREE.Vector3(0, 0, 14), dead: false };
  level.flow.compute(fakePlayer.pos.x, fakePlayer.pos.z, true);

  // Each view also selects an arm-axis candidate, so one run answers which
  // Mixamo local axis actually swings the shoulder forward.
  const views = [
    { p: [0, 1.9, 22], t: [0, 1.4, 30], pose: { armEuler: [1, 0, 0], foreEuler: [1, 0.4, 0] } },
    { p: [0, 1.9, 22], t: [0, 1.4, 30], pose: { armEuler: [0, 0, -1], foreEuler: [0, 0.4, -1] } },
    { p: [0, 1.9, 22], t: [0, 1.4, 30], pose: { armEuler: [0, -1, 0], foreEuler: [0, -1, 0.4] } },
    { p: [-6, 1.7, 26], t: [-3.4, 1.5, 30], pose: { armEuler: [1, 0, 0], foreEuler: [1, 0.4, 0] } },
    { p: [0, 12, 16], t: [0, 1, 30], pose: { armEuler: [1, 0, 0], foreEuler: [1, 0.4, 0] } },
  ];
  let vi = 0; window.__setView = n => { vi = n; };

  let t = 0, frames = 0; const times = [];
  const loop = () => {
    const dt = 0.016; t += dt; frames++;
    const s = performance.now();
    const v = views[vi];
    if (v.pose) Object.assign(POSE, v.pose);
    stage.camera.position.set(...v.p); stage.camera.lookAt(...v.t);
    stage.updateFlashlight(stage.camera, true);
    stage.updateShadowFocus(stage.camera.position, new THREE.Vector3(0,0,-1).applyQuaternion(stage.camera.quaternion));
    zm.update(dt, fakePlayer, t);
    fx.update(dt);
    level.update(dt, stage.camera.position, t);
    sky.update(dt, t, stage.camera.position);
    stage.update(dt, t);
    stage.render();
    times.push(performance.now() - s);
    if (frames === 24) {
      const so = times.slice().sort((a,b)=>a-b);
      report.frameMs = { median: Math.round(so[12]*100)/100, p90: Math.round(so[21]*100)/100 };
      report.draws = stage.drawCalls; report.tris = stage.triangles;
      report.alive = zm.aliveCount;
      report.ok = report.errors.length === 0;
      report.done = true;
    }
    requestAnimationFrame(loop);
  };
  loop();
} catch (e) { report.errors.push('fatal: ' + (e && e.stack || e)); report.done = true; report.ok = false; }
})();
</script></body></html>
