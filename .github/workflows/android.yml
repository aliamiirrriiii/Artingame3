name: Build Android APK

# The APK cannot be built in the authoring sandbox: dl.google.com and
# maven.google.com are blocked there, and the Android Gradle Plugin is only
# published on Google's Maven repository. A GitHub runner has both the Android
# SDK and network access, so this is where the APK actually gets made.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'vendor/**'
      - 'index.html'
      - 'tools/assets.manifest.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download game assets
        # Zero dependencies — plain node and the built-in fetch.
        run: node tools/fetch-assets.mjs

      - name: Logic tests
        run: |
          npm install --no-audit --no-fund --omit=optional three@0.180.0
          node tools/units.mjs

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        working-directory: android
        # Unsigned unless keystore properties are configured. Not allowed to
        # fail silently: assembleRelease also runs lintVital, which is where a
        # genuinely broken manifest or backup rule shows up.
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK contents
        # Guards against the quiet failure: an APK that builds, installs and
        # launches to a black screen because an asset never made it in.
        run: |
          for APK in $(find android/app/build/outputs/apk -name '*.apk' | sort); do
            node tools/verify-apk.mjs "$APK"
          done

      - name: Report APK size
        run: |
          {
            echo "### APK output"
            for f in $(find android/app/build/outputs/apk -name '*.apk' | sort); do
              printf -- '- `%s` — %s\n' "$f" "$(du -h "$f" | cut -f1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: night-of-the-risen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: night-of-the-risen-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  web:
    name: Headless browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download game assets
        run: node tools/fetch-assets.mjs

      - name: Logic tests
        run: node tools/units.mjs

      - name: Boot and render
        run: node tools/smoke.mjs --viewport 800x450

      - name: Touch controls
        run: node tools/touchtest.mjs
