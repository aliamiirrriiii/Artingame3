<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { MaterialLibrary } from '../src/world/materials.js';
import { buildWeapon, triangleCount } from '../src/weapons/gunsmith.js';
import { Viewmodel } from '../src/weapons/viewmodel.js';
import { MODEL_VIEWMODELS, buildModelWeapon, buildAdoptedWeapon } from '../src/weapons/viewmodels.js';
import { WEAPONS } from '../src/weapons/arsenal.js';
import { handsTemplate, attachHands } from '../src/weapons/hands.js';

/**
 * Renders every weapon the gunsmith can build, laid out in a grid and lit like
 * a product shot.
 *
 *   ?ads=rifle            hold one weapon exactly as aiming does, from the eye,
 *                         with a centre reticle drawn over it — the only way to
 *                         see whether the irons actually land on the crosshair.
 *   ?anim=1               headless: equip every weapon in turn through the real
 *                         Viewmodel, fire it, reload it, spin and charge it, and
 *                         check its moving parts actually moved.
 *
 * A triangle count cannot tell you that a magazine is inside the trigger guard
 * or that a scope is mounted upside down. Looking at all twelve at once, at the
 * same scale, is the only way to catch a silhouette that is subtly wrong.
 *
 *   ?only=rifle,shotgun   preview a subset
 *   ?view=1               side elevation instead of three-quarter
 *   ?hb=0,-0.01,0         nudge the hands off the fitted grip, to tune it
 *   ?hands=1              every weapon with the shared gloves fitted to it,
 *                         seen over the shooter's own knuckles — the only way
 *                         to tell a hand wrapped round a grip from one buried
 *                         in it
 */
const report = { errors: [], weapons: [] };
window.__smoke = report;
addEventListener('error', e => report.errors.push('window: ' + e.message));
addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

const q = new URLSearchParams(location.search);
const only = q.get('only') ? q.get('only').split(',') : null;
const IDS = Object.keys(WEAPONS).filter((id) => !only || only.includes(id));

(async () => {
try {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  const W = Number(q.get('w') || 1600), H = Number(q.get('h') || 900);
  renderer.setSize(W, H, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x101216);

  const assets = new AssetManager(renderer);
  // Paths in the manifest are relative to the site root, not to tools/.
  const manifest = JSON.parse(JSON.stringify(MANIFEST));
  for (const list of Object.values(manifest)) for (const e of list) e.url = '../' + e.url;
  await assets.loadAll(manifest, { anisotropy: 8 });

  // A neutral studio box, not one of the game's HDRIs: the quarry sky the menu
  // uses is sand-coloured, and it made every steel part in here look khaki.
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = Number(q.get('env') ?? 0.9);
  // A key, a rim and a soft fill: enough to read a chamfer.
  // Neutral white, so a finish that looks khaki here really is khaki.
  const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(2, 4, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-3, 1.5, -2.5); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));

  const mats = new MaterialLibrary(assets);
  mats.setEnvironment?.(scene.environment);

  // Viewmodel inspection: what is in the downloaded rig, where it sits, and how
  // big it is once its own hold animation has been applied. A rigged model's
  // bind pose tells you none of that.
  if (q.get('inspect') || q.get('inspectFile')) {
    const gltf = q.get('inspectFile')
      ? await new GLTFLoader().loadAsync(`fixtures/${q.get('inspectFile')}.glb`)
      : assets.model(q.get('inspect'));
    if (!gltf) { report.errors.push(`no model "${q.get('inspect')}"`); report.done = true; return; }
    const root = gltf.scene;
    if (gltf.animations && gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(root);
      mixer.clipAction(gltf.animations[0]).play();
      mixer.update(Number(q.get('t') || 0.05));
    }
    root.updateMatrixWorld(true);
    const box = (o) => {
      const b = new THREE.Box3().setFromObject(o);
      return { min: b.min.toArray().map(v => +v.toFixed(3)), max: b.max.toArray().map(v => +v.toFixed(3)) };
    };
    const meshes = [];
    root.traverse((o) => {
      if (!o.isMesh && !o.isSkinnedMesh) return;
      meshes.push({
        name: o.name, skinned: !!o.isSkinnedMesh,
        material: Array.isArray(o.material) ? o.material.map(m => m.name) : o.material.name,
        tris: Math.round((o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3),
        box: box(o),
      });
    });
    // Where the hands actually are. Calibrating a viewmodel by eye takes a
    // render per guess; the grip point is a bone, so it can just be read.
    const bones = {};
    for (const n of ['r_wrist', 'l_wrist', 'r_middle_low', 'l_middle_low', 'root',
                     'MuzzleSocket', 'PrimaryGripSocket', 'SupportGripSocket',
                     'MagazineWellSocket', 'MagazineGripSocket', 'ChargingHandleSocket',
                     'OpticRailSocket']) {
      const o = root.getObjectByName(n);
      if (o) bones[n] = o.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3));
    }
    // The spare magazine floats beside the weapon as a display prop; leaving it
    // in makes an AWM measure two metres long.
    const spares = [];
    root.traverse((o) => { if (/spare/i.test(o.name || '')) spares.push(o); });
    for (const o of spares) o.visible = false;
    const realBox = new THREE.Box3();
    root.traverse((o) => {
      if ((o.isMesh || o.isSkinnedMesh) && !/spare/i.test(o.name || '')
          && !/spare/i.test(o.parent?.name || '')) realBox.expandByObject(o);
    });
    for (const o of spares) o.visible = true;

    report.inspect = {
      bones,
      withoutSpares: {
        min: realBox.min.toArray().map((v) => +v.toFixed(3)),
        max: realBox.max.toArray().map((v) => +v.toFixed(3)),
      },
      clips: (gltf.animations || []).map(a => ({ name: a.name, dur: +a.duration.toFixed(2) })),
      whole: box(root),
      meshes,
      topLevel: root.children.map(c => ({ name: c.name, type: c.type, pos: c.position.toArray().map(v => +v.toFixed(3)) })),
    };
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  // Mechanism check. The bot smoke run cannot reach the wall-buy weapons, so
  // this drives every one of them through the real Viewmodel and asserts that
  // the slide, bolt, pump, cylinder, magazine and rotor each move when they are
  // supposed to. A gun whose action is welded shut still renders perfectly.
  /**
   * Widest dimension of a fitted pair of hands, in metres. Returns 0 for the
   * one weapon that came with its own arms — there is nothing to measure
   * there, its gloves are a primitive of the same skinned mesh as the rifle —
   * and null when a weapon has nothing holding it at all.
   */
  const handSpan = (g) => {
    if (!g) return null;
    if (g.userData.ownHands) return 0;
    const holder = g.userData.hands;
    if (!holder) return null;
    holder.updateMatrixWorld(true);
    const size = new THREE.Box3().setFromObject(holder).getSize(new THREE.Vector3());
    return +Math.max(size.x, size.y, size.z).toFixed(3);
  };

  /**
   * How far the trigger palm ended up from the grip it was fitted to, in
   * metres. This is the invariant the whole fit rests on, and the only check
   * that catches a hands template cloned out of an already-scaled source
   * scene: the arms come out the right size either way, they just land in the
   * wrong place.
   *
   */
  const palmOffset = (g) => {
    const h = g && g.userData.hands, pts = g && g.userData.handPoints;
    if (!h || !pts) return null;
    // Refresh from the very top: this harness never renders, so the camera
    // and rig matrices the weapon hangs off are otherwise whatever the last
    // update left them, and a partial refresh reads the palm in one frame's
    // space and the weapon in another's.
    let top = g;
    while (top.parent) top = top.parent;
    top.updateMatrixWorld(true);
    const b = {};
    h.traverse((o) => { if (o.name) b[o.name] = o; });
    if (!b.r_wrist || !b.r_middle_low) return null;
    const p = new THREE.Vector3().setFromMatrixPosition(b.r_wrist.matrixWorld)
      .lerp(new THREE.Vector3().setFromMatrixPosition(b.r_middle_low.matrixWorld), 0.5);
    return +g.worldToLocal(p).distanceTo(pts.grip).toFixed(4);
  };

  if (q.get('anim') === '1') {
    const stage = { camera: new THREE.PerspectiveCamera(75, W / H, 0.01, 100) };
    const vm = new Viewmodel(stage, mats, null, assets);
    const player = { bobPhase: 0, bobAmount: 0.4, sprinting: false, pos: new THREE.Vector3() };
    const input = { mouse: { dx: 0, dy: 0 } };
    const step = (n, opts) => { for (let i = 0; i < n; i++) vm.update(1 / 60, player, input, opts); };

    for (const id of Object.keys(WEAPONS)) {
      const spec = WEAPONS[id];
      vm.equip(spec);
      const parts = vm.parts;
      const rest = {};
      for (const [k, v] of Object.entries(parts)) rest[k] = v.position.clone();
      const moved = new Set();
      const watch = () => {
        for (const [k, v] of Object.entries(parts)) {
          if (v.position.distanceTo(rest[k]) > 1e-5 || Math.abs(v.rotation.z) > 1e-4) moved.add(k);
        }
      };

      const palmOff = palmOffset(vm.current);
      vm.punch(1);
      for (let i = 0; i < 24; i++) { step(1); watch(); }
      vm.startReload(1.2);
      for (let i = 0; i < 80; i++) { step(1); watch(); }
      vm.setSpin(30); vm.setCharge(1);
      for (let i = 0; i < 20; i++) { step(1); watch(); }
      vm.setSpin(0); vm.setCharge(0);
      step(10, { ads: true, adsAmount: 1 });

      const animatable = Object.keys(parts).filter((k) => k !== 'body' && k !== 'reticle' && k !== 'pilot' && k !== 'core');
      const still = animatable.filter((k) => !moved.has(k));
      const hands = handSpan(vm.current);
      report.weapons.push({ id, parts: Object.keys(parts), moved: [...moved], still, hands, palmOff });
      if (still.length) report.errors.push(`${id}: ${still.join(',')} never moved`);
      if (hands === null) report.errors.push(`${id}: nothing holding it`);
      else if (hands && (hands < 0.12 || hands > 0.75)) report.errors.push(`${id}: hands span ${hands}m`);
      if (palmOff !== null && palmOff > 0.002) {
        report.errors.push(`${id}: trigger palm ${palmOff}m off the grip`);
      }
    }
    vm.dispose();

    // The Galil viewmodel scales and offsets the shared source scene in place,
    // and the hands are cloned out of that same scene. Equip it first and a
    // template taken afterwards arrives pre-scaled — hands a quarter the size
    // they should be, on every weapon picked up after it. Equipping order is
    // the player's choice, so it has to be tested both ways round.
    const rigOf = (g) => {
      const inst = g.userData.hands && g.userData.hands.children[0];
      return inst ? [...inst.position.toArray(), inst.scale.x].map((v) => +v.toFixed(6)) : null;
    };
    const plain = new Viewmodel(stage, mats, null, assets);
    plain.equip(WEAPONS.shotgun);
    const first = rigOf(plain.current);
    plain.dispose();

    const vm2 = new Viewmodel(stage, mats, null, assets);
    vm2.equip(WEAPONS.rifle);
    vm2.equip(WEAPONS.shotgun);
    const after = rigOf(vm2.current);
    const off2 = palmOffset(vm2.current);
    report.handRig = { alone: first, afterRifle: after, span: handSpan(vm2.current), palmOffset: off2 };
    if (off2 === null || off2 > 0.002) {
      report.errors.push(`shotgun after rifle: trigger palm ${off2}m off the grip`);
    }
    if (!first || !after || first.some((v, i) => Math.abs(v - after[i]) > 1e-6)) {
      report.errors.push(`shotgun's hands land differently after the rifle: ${first} vs ${after}`);
    }
    vm2.dispose();
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  // Side-by-side against a downloaded pack. Mine on the top row, theirs below,
  // same lighting, each normalised to the same overall length — because the
  // only question worth answering is which one looks better, and a triangle
  // count cannot answer it.
  //   ?compare=pistol:m1911_reloadable,smg:mp5a5_reloadable
  //
  // Fixtures live in tools/fixtures/, which is gitignored and — importantly —
  // outside the assets/ tree that the Gradle sync copies wholesale into the
  // APK. Evaluation models are not shipping models. Populate it with:
  //
  //   git clone --filter=blob:none --no-checkout --depth 1 \
  //     https://github.com/AetherRadar/operation-steel-tide /tmp/st
  //   git -C /tmp/st sparse-checkout set --no-cone \
  //     assets/models/steel_tide_reloadable_weapons
  //   git -C /tmp/st checkout
  //   cp /tmp/st/assets/models/steel_tide_reloadable_weapons/*.glb tools/fixtures/
  if (q.get('compare')) {
    const pairs = q.get('compare').split(',').map((s) => s.split(':'));
    const loader = new GLTFLoader();
    const tags = document.getElementById('tags');
    const CELL = 1.0;
    const place = (obj, col, row, label) => {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const c = box.getCenter(new THREE.Vector3());
      const k = (CELL * 0.80) / Math.max(size.x, size.y, size.z);
      const holder = new THREE.Group();
      obj.position.set(-c.x * k, -c.y * k, -c.z * k);
      obj.scale.setScalar(k);
      holder.add(obj);
      holder.position.set((col - (pairs.length - 1) / 2) * CELL, row === 0 ? 0.34 : -0.34, 0);
      holder.rotation.set(0.28, 2.15, 0);
      scene.add(holder);
      const t = document.createElement('div');
      t.innerHTML = `<b>${label}</b>`;
      tags.appendChild(t);
      holder.userData.tag = t;
      return holder;
    };
    for (let i = 0; i < pairs.length; i++) {
      const [mineId, theirFile] = pairs[i];
      const mine = buildWeapon(WEAPONS[mineId], mats);
      place(mine, i, 0, `OURS · ${WEAPONS[mineId].short} · ${Math.round(triangleCount(mine))} tris`);
      try {
        const g = await loader.loadAsync(`fixtures/${theirFile}.glb`);
        let tris = 0;
        g.scene.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
        place(g.scene, i, 1, `THEIRS · ${theirFile.replace('_reloadable', '').toUpperCase()} · ${Math.round(tris)} tris`);
      } catch (e) { report.errors.push(`${theirFile}: ${e.message}`); }
    }
    const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 40);
    cam.position.set(0, 0, pairs.length * CELL * 2.0);
    cam.lookAt(0, 0, 0);
    renderer.render(scene, cam);
    const v = new THREE.Vector3();
    for (const o of scene.children) {
      if (!o.userData.tag) continue;
      v.copy(o.position).project(cam);
      o.userData.tag.style.left = `${(v.x * 0.5 + 0.5) * 100}%`;
      o.userData.tag.style.top = `${(-v.y * 0.5 + 0.5) * 100 + 9}%`;
    }
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  // Hip view: exactly what the player sees, at the game's field of view, with
  // the calibration numbers overridable from the query string. Calibrating a
  // downloaded viewmodel is a handful of guesses, and this is the loop that
  // makes each guess cost one render rather than one code change.
  const vm = q.get('vm');
  if (vm && WEAPONS[vm]) {
    const cfg = { ...(MODEL_VIEWMODELS[WEAPONS[vm].model.type] || {}) };
    if (q.get('vs')) cfg.scale = Number(q.get('vs'));
    if (q.get('vo')) cfg.offset = q.get('vo').split(',').map(Number);
    const g = (cfg.asset && (cfg.adopt ? buildAdoptedWeapon(WEAPONS[vm], cfg, assets, mats)
      : buildModelWeapon(WEAPONS[vm], cfg, assets))) || buildWeapon(WEAPONS[vm], mats);
    if (q.get('nohands') !== '1') attachHands(g, WEAPONS[vm], handsTemplate(assets),
      { bias: q.get('hb') ? q.get('hb').split(',').map(Number) : null });
    const rig = new THREE.Group();
    rig.add(g);
    rig.scale.setScalar(0.94);
    const vmBase = (q.get('vp') ? q.get('vp').split(',').map(Number)
      : (g.userData.basePos || [0.136, -0.116, -0.335])).slice();
    vmBase[1] -= g.userData.hipDrop || 0;
    rig.position.set(...vmBase);
    rig.rotation.set(0.022, 0.055, -0.018);
    scene.add(rig);
    const cam = new THREE.PerspectiveCamera(75, W / H, 0.01, 40);
    const b = new THREE.Box3().setFromObject(g);
    report.weapons.push({ id: vm, scale: cfg.scale, offset: cfg.offset,
      box: { min: b.min.toArray().map(v => +v.toFixed(3)), max: b.max.toArray().map(v => +v.toFixed(3)) } });
    renderer.render(scene, cam);
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  // Sighting check: reproduce the viewmodel's aimed pose and look down it.
  const ads = q.get('ads');
  if (ads && WEAPONS[ads]) {
    const cfg = MODEL_VIEWMODELS[WEAPONS[ads].model.type];
    const g = (cfg && (cfg.adopt ? buildAdoptedWeapon(WEAPONS[ads], cfg, assets, mats)
      : buildModelWeapon(WEAPONS[ads], cfg, assets))) || buildWeapon(WEAPONS[ads], mats);
    if (q.get('nohands') !== '1') attachHands(g, WEAPONS[ads], handsTemplate(assets),
      { pole: q.get('pole') ? q.get('pole').split(',').map(Number) : null });
    const rig = new THREE.Group();
    rig.add(g);
    rig.position.set(...(g.userData.adsPos || [0, -(g.userData.sightY ?? 0.02),
      -Math.min(0.40, Math.max(0.22, 0.12 + (g.userData.rear ?? 0.10)))]));
    scene.add(rig);
    const cam = new THREE.PerspectiveCamera(75, W / H, 0.01, 40);
    const mark = document.createElement('div');
    mark.style.cssText = 'position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;'
      + 'border:0;background:'
      + 'linear-gradient(#e33,#e33) 50% 0/1px 8px no-repeat,'
      + 'linear-gradient(#e33,#e33) 50% 100%/1px 8px no-repeat,'
      + 'linear-gradient(#e33,#e33) 0 50%/8px 1px no-repeat,'
      + 'linear-gradient(#e33,#e33) 100% 50%/8px 1px no-repeat';
    document.body.appendChild(mark);
    renderer.render(scene, cam);
    report.weapons.push({ id: ads, sightY: g.userData.sightY, rear: g.userData.rear,
      adsZ: rig.position.z, muzzle: g.userData.muzzle.toArray() });
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  // Hands check: every weapon with the shared arms fitted, at a common scale,
  // from just behind and above the shooter's wrist. A grip point that is a
  // centimetre out is invisible in a bounding box and obvious here.
  if (q.get('hands') === '1') {
    const tpl = handsTemplate(assets);
    if (!tpl) { report.errors.push('hands template did not load'); report.done = true; return; }
    const cols = 4;
    const CELL = 0.62;
    const tags = document.getElementById('tags');
    const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 40);
    const rows = Math.ceil(IDS.length / cols);

    IDS.forEach((id, i) => {
      const spec = WEAPONS[id];
      const cfg = MODEL_VIEWMODELS[spec.model.type];
      const g = (cfg && (cfg.adopt ? buildAdoptedWeapon(spec, cfg, assets, mats)
        : buildModelWeapon(spec, cfg, assets))) || buildWeapon(spec, mats);
      const holder = attachHands(g, spec, tpl);
      const pts = g.userData.handPoints;
      report.weapons.push({
        id, type: spec.model.type, hands: !!holder,
        own: !!g.userData.ownHands,
        grip: pts && pts.grip.toArray().map((v) => +v.toFixed(3)),
        support: pts && pts.support.toArray().map((v) => +v.toFixed(3)),
        palmOff: palmOffset(g),
      });
      const off = palmOffset(g);
      if (holder && (off === null || off > 0.002)) {
        report.errors.push(`${id}: trigger palm ${off}m off the grip`);
      }
      if (!holder && !g.userData.ownHands) report.errors.push(`${id}: nothing holding it`);

      // Frame the weapon and the arms together, so a hand left behind shows up
      // as a hand left behind rather than as an off-centre gun.
      const cell = new THREE.Group();
      cell.add(g);
      const box = new THREE.Box3().setFromObject(cell);
      const size = box.getSize(new THREE.Vector3());
      const centre = box.getCenter(new THREE.Vector3());
      const sc = (CELL * 0.80) / Math.max(size.x, size.y, size.z);
      g.position.set(-centre.x * sc, -centre.y * sc, -centre.z * sc);
      g.scale.setScalar(sc);
      cell.position.set((i % cols - (cols - 1) / 2) * CELL,
        -(Math.floor(i / cols) - (rows - 1) / 2) * CELL * 1.06, 0);
      cell.rotation.set(Number(q.get('hp') || 0.26), Number(q.get('hy') || 2.40), 0);
      scene.add(cell);

      const t = document.createElement('div');
      t.innerHTML = `<b>${spec.short}</b>${holder ? 'fitted' : g.userData.ownHands ? 'own arms' : 'NONE'}`;
      tags.appendChild(t);
      cell.userData.tag = t;
    });

    // Fit the grid to the frame in both axes, so a one-row subset fills the
    // viewport instead of sitting as a stripe in the middle of it.
    const half = Math.tan((camera.fov * Math.PI / 180) / 2);
    camera.position.set(0, 0, 1.12 * Math.max(
      (rows * CELL * 1.06 * 0.5 + 0.10) / half,
      (cols * CELL * 0.5) / (half * camera.aspect),
    ));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    const v = new THREE.Vector3();
    for (const o of scene.children) {
      if (!o.userData.tag) continue;
      v.copy(o.position).project(camera);
      o.userData.tag.style.left = `${(v.x * 0.5 + 0.5) * 100}%`;
      o.userData.tag.style.top = `${(-v.y * 0.5 + 0.5) * 100 + 7}%`;
    }
    report.ok = report.errors.length === 0;
    report.done = true;
    return;
  }

  const cols = Math.min(4, IDS.length);
  const rows = Math.ceil(IDS.length / cols);
  const CELL = 0.90;
  const ROW = Number(q.get('row') || 1.05);
  const tags = document.getElementById('tags');
  const camera = new THREE.PerspectiveCamera(28, W / H, 0.05, 40);

  const bounds = new THREE.Box3();
  IDS.forEach((id, i) => {
    const spec = WEAPONS[id];
    const g = buildWeapon(spec, mats);
    const tris = triangleCount(g);
    report.weapons.push({ id, type: spec.model.type, tris, parts: Object.keys(g.userData.parts) });

    // Centre each weapon in its cell and scale it to a common length, so a
    // pistol and a railgun can be compared on detail rather than on size.
    const box = new THREE.Box3().setFromObject(g);
    const size = box.getSize(new THREE.Vector3());
    const centre = box.getCenter(new THREE.Vector3());
    const holder = new THREE.Group();
    const s = (CELL * 0.78) / Math.max(size.x, size.y, size.z);
    g.position.set(-centre.x * s, -centre.y * s, -centre.z * s);
    g.scale.setScalar(s);
    holder.add(g);
    const cx = (i % cols - (cols - 1) / 2) * CELL;
    const cy = -(Math.floor(i / cols) - (rows - 1) / 2) * CELL * ROW;
    holder.position.set(cx, cy, 0);
    holder.rotation.set(q.get('view') === '1' ? 0 : 0.30, q.get('view') === '1' ? Math.PI / 2 : 2.15, 0);
    scene.add(holder);
    bounds.expandByPoint(new THREE.Vector3(cx, cy, 0));

    const t = document.createElement('div');
    t.innerHTML = `<b>${spec.short}</b>${Math.round(tris)} tris · ${Object.keys(g.userData.parts).join(' ')}`;
    tags.appendChild(t);
    holder.userData.tag = t;
  });

  camera.position.set(0, 0, Math.max(cols * CELL * 1.62, rows * CELL * ROW * 2.1));
  camera.lookAt(0, 0, 0);

  const place = () => {
    const v = new THREE.Vector3();
    for (const o of scene.children) {
      if (!o.userData.tag) continue;
      v.copy(o.position).project(camera);
      o.userData.tag.style.left = `${(v.x * 0.5 + 0.5) * 100}%`;
      o.userData.tag.style.top = `${(-v.y * 0.5 + 0.5) * 100 + 8}%`;
    }
  };

  renderer.render(scene, camera);
  place();
  report.ok = report.errors.length === 0;
  report.done = true;
} catch (err) {
  report.errors.push(String(err && err.stack || err));
  report.ok = false;
  report.done = true;
}
})();
</script>
</body></html>
