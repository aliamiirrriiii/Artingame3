<script type="module">
/*
 * Blood lab.
 *
 * The blood is a small simulation now — droplets sweep against the level,
 * land, feed pools, pools spread and merge, and what hits a wall runs down it.
 * None of that is visible in a still frame of a firefight, and all of it is
 * easy to break silently, so it gets its own bench: a wall, a floor, a set of
 * bursts fired at known places, and assertions about where the fluid ended up.
 *
 *   ?view=wall    looking at the sprayed wall
 *   ?view=pool    looking down at the pools
 *   ?view=merge   two pools growing into one
 */
import * as THREE from 'three';
import { Stage } from '../src/render/stage.js';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { Effects } from '../src/render/fx.js';
import { CollisionWorld, Box } from '../src/world/collision.js';
import { PRESETS } from '../src/core/quality.js';

const report = { errors: [], steps: [] };
window.__smoke = report;
addEventListener('error', e => report.errors.push('window: ' + e.message));
addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

const qs = new URLSearchParams(location.search);

(async () => {
try {
  const preset = PRESETS[qs.get('q') || 'medium'];
  const stage = new Stage(document.getElementById('c'), preset);
  stage.resize(Number(qs.get('w') || 1280), Number(qs.get('h') || 720));
  const m = JSON.parse(JSON.stringify(MANIFEST));
  for (const g of ['textures','models','hdri','buffers']) for (const a of m[g]) a.url = '../' + a.url;
  const assets = new AssetManager(stage.renderer);
  await assets.loadAll(m, { anisotropy: preset.anisotropy });
  stage.applyEnvironment(assets.environment('day'), { intensity: 1.25, fog: 0xb9c6d4 });
  report.steps.push('init');

  // A floor and one wall, in geometry and in collision, so what the sweep
  // tests against is exactly what is drawn.
  const WALL_Z = 6, WALL_H = 4, WALL_HX = 7;
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0x2e2e2c, roughness: 0.98 }),
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  stage.scene.add(floor);

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_HX * 2, WALL_H, 0.4),
    new THREE.MeshStandardMaterial({ color: 0x6b6559, roughness: 0.92 }),
  );
  wall.position.set(0, WALL_H / 2, WALL_Z);
  wall.receiveShadow = true;
  stage.scene.add(wall);

  const collision = new CollisionWorld(6);
  collision.add(new Box(0, 0, WALL_Z, WALL_HX, 0.2, WALL_H, 0, 'world'));

  const fx = new Effects(stage.scene, assets, preset);
  fx.setCollision(collision);
  fx.setFog(stage.fogColor, stage.fogDensity);
  fx.setLighting(stage.lightLevel());
  fx.setViewportHeight(720);
  report.steps.push('scene');

  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const step = (seconds, dt = 1 / 60) => {
    for (let i = 0; i < Math.round(seconds / dt); i++) fx.update(dt);
  };

  // ---------------------------------------------------------------- cases
  //
  // 1. Spray at a wall from close range. Everything thrown at it should end
  //    up on it or under it — nothing may still be in the air afterwards.
  const before = fx.bloodDecals.live;
  for (let i = 0; i < 4; i++) {
    fx.bloodBurst(V(0, 1.6, WALL_Z - 1.2), V(0, 0.1, 1).normalize(), 2.2, true);
  }
  const airborne = fx.blood.count;
  step(3.5);
  report.wall = {
    emitted: airborne,
    stillFlying: fx.blood.count,
    marks: fx.bloodDecals.live - before,
    runners: fx.runners.n,
  };
  if (airborne < 20) report.errors.push('wall: burst emitted almost nothing');
  if (fx.blood.count > 0) report.errors.push(`wall: ${fx.blood.count} droplets never landed`);
  if (report.wall.marks < 10) report.errors.push(`wall: only ${report.wall.marks} marks left behind`);

  // 2. Marks actually landed on the wall plane, not through it.
  const mtx = new THREE.Matrix4(), mp = new THREE.Vector3();
  let past = 0, onWall = 0;
  for (let i = 0; i < fx.bloodDecals.live; i++) {
    fx.bloodDecals.gl.mesh.getMatrixAt(i, mtx);
    mp.setFromMatrixPosition(mtx);
    // Inside the wall's volume, rather than on a face of it. The top of the
    // wall is a perfectly good place to land and sits at z beyond the front
    // face, so height has to be part of the test.
    if (Math.abs(mp.z - WALL_Z) < 0.15 && mp.y < WALL_H - 0.05) past++;
    if (Math.abs(mp.z - (WALL_Z - 0.2)) < 0.1 && mp.y > 0.2) onWall++;
  }
  report.wall.throughWall = past;
  report.wall.onWallFace = onWall;
  if (past > 0) report.errors.push(`wall: ${past} marks landed inside or behind the wall`);
  if (onWall < 5) report.errors.push(`wall: only ${onWall} marks stuck to the wall face`);

  // 3. Runners must travel downward and leave a trail, then hand off to a pool.
  fx.runners.clear();
  fx.runners.spawn(-3, 3.2, WALL_Z - 0.22, 0, -1, 0.09, 0.4);
  const runY0 = fx.runners.y[fx.runners.n - 1];
  step(1.2);
  const runY1 = fx.runners.n ? fx.runners.y[fx.runners.n - 1] : -1;
  report.runner = { from: +runY0.toFixed(3), to: +runY1.toFixed(3) };
  if (!(runY1 < runY0 - 0.4) && fx.runners.n) {
    report.errors.push(`runner: barely moved (${runY0.toFixed(2)} -> ${runY1.toFixed(2)})`);
  }

  // 4. Pools: one place bled into repeatedly makes ONE pool that grows.
  fx.pools.clear();
  fx.bloodPool(-20, -20, 1.0);
  const r0 = fx.pools.r[0];
  step(0.1);
  const rEarly = fx.pools.r[0];
  step(3);
  const rLate = fx.pools.r[0];
  report.pool = { count: fx.pools.n, start: +r0.toFixed(3), early: +rEarly.toFixed(3), settled: +rLate.toFixed(3) };
  if (fx.pools.n !== 1) report.errors.push(`pool: expected 1 pool, got ${fx.pools.n}`);
  if (!(rLate > rEarly + 0.2)) report.errors.push('pool: never spread from its volume');
  if (rLate > 3.0) report.errors.push(`pool: ran away to ${rLate.toFixed(2)}m`);

  // Bleeding into the same spot again must feed that pool, not stack a new one.
  for (let i = 0; i < 6; i++) fx.bloodPool(-20 + (i - 3) * 0.12, -20, 0.8);
  step(2);
  report.pool.afterRefeed = fx.pools.n;
  report.pool.refedRadius = +fx.pools.r[0].toFixed(3);
  if (fx.pools.n !== 1) report.errors.push(`pool: refeeding made ${fx.pools.n} pools instead of feeding one`);
  if (!(fx.pools.r[0] > rLate)) report.errors.push('pool: extra blood did not widen it');

  // 5. Two pools laid apart must grow into each other and merge.
  fx.pools.clear();
  fx.bloodPool(10, 10, 1.5);
  fx.bloodPool(11.4, 10, 1.5);
  report.merge = { started: fx.pools.n };
  step(6);
  report.merge.ended = fx.pools.n;
  report.merge.radius = fx.pools.n ? +fx.pools.r[0].toFixed(3) : 0;
  if (report.merge.started !== 2) report.errors.push('merge: the two pools were not laid down separately');
  if (report.merge.ended !== 1) report.errors.push(`merge: ${report.merge.ended} pools still apart after 6s`);

  // 6. Distant blood must not be captured by an unrelated pool.
  fx.pools.clear();
  fx.bloodPool(0, 0, 0.6);
  fx.bloodPool(9, 0, 0.6);
  step(0.2);
  if (fx.pools.n !== 2) report.errors.push('pool: two pools nine metres apart were merged');

  // 7. Gibs bounce off the wall rather than passing through it.
  fx.gibs.clear();
  for (let i = 0; i < 12; i++) {
    fx.gibs.spawn(0, 1.4, WALL_Z - 1.6, (i - 6) * 0.2, 2, 9, 1, 6);
  }
  step(1.5);
  let gibPast = 0;
  for (let i = 0; i < fx.gibs.n; i++) if (fx.gibs.p[i * 3 + 2] > WALL_Z - 0.15) gibPast++;
  report.gibs = { live: fx.gibs.n, throughWall: gibPast };
  if (gibPast > 0) report.errors.push(`gibs: ${gibPast} chunks went through the wall`);

  // 8. Budget: a long fight must not grow the pool list without bound.
  fx.pools.clear();
  for (let i = 0; i < 400; i++) {
    fx.bloodPool(Math.random() * 40 - 20, Math.random() * 40 - 20, 1.2);
    if (i % 20 === 0) step(0.05);
  }
  report.poolBudget = { n: fx.pools.n, cap: fx.pools.capacity };
  if (fx.pools.n > fx.pools.capacity) report.errors.push('pool: overran its budget');
  report.steps.push('cases');

  // ------------------------------------------------------------- viewing
  //
  // A frame worth looking at, so the numbers above can be checked by eye.
  fx.clear();
  const view = qs.get('view') || 'wall';
  if (view === 'wall') {
    for (let i = 0; i < 5; i++) {
      fx.bloodBurst(V((i - 2) * 1.1, 1.5 + (i % 2) * 0.4, WALL_Z - 1.1), V(0, 0.15, 1).normalize(), 2.4, true);
    }
    step(2.5);
    stage.camera.position.set(0, 1.8, 0.4);
    stage.camera.lookAt(0, 1.7, WALL_Z);
  } else if (view === 'merge') {
    fx.bloodPool(-0.8, 2, 1.6);
    fx.bloodPool(0.8, 2, 1.6);
    step(5);
    stage.camera.position.set(0, 4.2, -2.2);
    stage.camera.lookAt(0, 0, 2);
  } else {
    for (let i = 0; i < 6; i++) {
      fx.bloodBurst(V(Math.cos(i) * 1.4, 1.2, 2 + Math.sin(i) * 1.4), V(Math.cos(i * 2), 0.2, Math.sin(i * 2)).normalize(), 2, true);
      fx.bloodPool(Math.cos(i) * 1.4, 2 + Math.sin(i) * 1.4, 1.1);
    }
    step(4);
    stage.camera.position.set(0, 5.5, -3);
    stage.camera.lookAt(0, 0, 2);
  }
  report.view = view;
  report.livePools = fx.pools.n;
  report.liveMarks = fx.bloodDecals.live;

  let frames = 0;
  const loop = () => {
    // No flashlight: it blows the wall out to white, and a multiply-blended
    // mark cannot darken a surface that is already clipped — which makes the
    // blood look absent when it is only over-lit.
    stage.updateFlashlight(stage.camera, false);
    stage.updateShadowFocus(stage.camera.position, V(0, 0, 1).applyQuaternion(stage.camera.quaternion));
    stage.update(1 / 60, frames / 60);
    stage.render();
    if (++frames === 4) {
      report.ok = report.errors.length === 0;
      report.done = true;
    }
    requestAnimationFrame(loop);
  };
  loop();
} catch (e) { report.errors.push('fatal: ' + (e && e.stack || e)); report.done = true; report.ok = false; }
})();
</script></body></html>
