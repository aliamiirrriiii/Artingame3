<!doctype html>
<html><head><meta charset="utf-8"><title>pose lab</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { MaterialLibrary } from '../src/world/materials.js';
import { Level } from '../src/world/level.js';
import { Effects } from '../src/render/fx.js';
import { ZombieManager, POSE } from '../src/entities/zombies.js';
import { PRESETS } from '../src/core/quality.js';
import { Stage } from '../src/render/stage.js';

const report = { errors: [], steps: [] };
window.__smoke = report;
addEventListener('error', e => report.errors.push('window: ' + e.message));
addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

// Candidate shoulder/elbow axis sets. One of these is the forward swing.
const CANDIDATES = [
  { label: 'X', armEuler: [1.2, 0, 0], foreEuler: [1.0, 0, 0] },
  { label: 'Y', armEuler: [0, 1.2, 0], foreEuler: [0, 1.0, 0] },
  { label: 'Z', armEuler: [0, 0, 1.2], foreEuler: [0, 0, 1.0] },
  { label: '-Y', armEuler: [0, -1.2, 0], foreEuler: [0, -1.0, 0] },
  { label: '-Z', armEuler: [0, 0, -1.2], foreEuler: [0, 0, -1.0] },
  { label: 'none', armEuler: [0, 0, 0], foreEuler: [0, 0, 0] },
];

(async () => {
try {
  const preset = PRESETS.medium;
  const stage = new Stage(document.getElementById('c'), preset);
  stage.resize(1100, 520);
  const m = JSON.parse(JSON.stringify(MANIFEST));
  for (const g of ['textures','models','hdri','buffers']) for (const a of m[g]) a.url = '../' + a.url;
  const assets = new AssetManager(stage.renderer);
  await assets.loadAll(m, { anisotropy: 4 });
  stage.applyEnvironment(assets.environment('day'), { intensity: 2.4, fog: 0x99a0aa });
  stage.scene.fog.density = 0.004;
  stage.hemi.intensity = 3.5; stage.sun.intensity = 3.0;
  const mats = new MaterialLibrary(assets);
  const level = new Level(stage.scene, mats, assets, preset).build();
  const fx = new Effects(stage.scene, assets, preset);
  const zm = new ZombieManager(stage.scene, assets, level, fx, preset);

  // A row of identical walkers, each posed with a different candidate axis,
  // standing still on the idle clip so only the pose layer differs.
  CANDIDATES.forEach((c, i) => {
    const z = zm.spawn('walker', new THREE.Vector3((i - 2.5) * 1.9, 0, 30), 1);
    if (!z) return;
    z.state = 'stagger'; z.staggerT = 9999; z.stateT = 1;
    z.root.position.y = 0;
    z.yaw = Math.PI; z.targetYaw = Math.PI;
    z.poseOverride = { armEuler: c.armEuler, foreEuler: c.foreEuler, armMirror: [1,-1,-1], armRaise: 1.0, foreArmBend: 0.9 };
    zm._setClip(z, 'Idle', 0);
  });
  report.labels = CANDIDATES.map(c => c.label);
  const fakePlayer = { pos: new THREE.Vector3(0, 0, 22), dead: false };
  level.flow.compute(0, 22, true);

  const views = [
    { p: [0, 1.5, 24.5], t: [0, 1.1, 30] },   // front on
    { p: [7.5, 1.5, 27], t: [0, 1.1, 30] },   // from the side
  ];
  let vi = 0; window.__setView = n => { vi = n; };

  let t = 0, frames = 0;
  const loop = () => {
    const dt = 0.016; t += dt; frames++;
    const v = views[vi];
    stage.camera.position.set(...v.p); stage.camera.lookAt(...v.t);
    stage.updateFlashlight(stage.camera, false);
    zm.update(dt, fakePlayer, t);
    fx.update(dt); level.update(dt, stage.camera.position, t); stage.update(dt, t);
    stage.render();
    if (frames === 12) { report.ok = report.errors.length === 0; report.done = true; }
    requestAnimationFrame(loop);
  };
  loop();
} catch (e) { report.errors.push('fatal: ' + (e && e.stack || e)); report.done = true; report.ok = false; }
})();
</script></body></html>
