<!doctype html>
<html><head><meta charset="utf-8"><title>smoke</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">
{"imports":{
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/"
}}
</script>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { Stage } from '../src/render/stage.js';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { MaterialLibrary } from '../src/world/materials.js';
import { Level } from '../src/world/level.js';
import { NightSky } from '../src/render/sky.js';
import { PRESETS } from '../src/core/quality.js';

const report = { errors: [], steps: [] };
window.__smoke = report;
window.addEventListener('error', e => report.errors.push('window: ' + e.message));
window.addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

const step = (s) => { report.steps.push(s); };

(async () => {
  try {
    const preset = PRESETS[new URLSearchParams(location.search).get('q') || 'high'];
    const stage = new Stage(document.getElementById('c'), preset);
    stage.resize(1280, 720);
    step('stage');

    // Rewrite manifest URLs to be relative to the repo root (we are in tools/).
    const m = JSON.parse(JSON.stringify(MANIFEST));
    for (const g of ['textures','models','hdri','buffers']) for (const a of m[g]) a.url = '../' + a.url;

    const assets = new AssetManager(stage.renderer);
    await assets.loadAll(m, { anisotropy: preset.anisotropy });
    report.loaded = {
      textures: assets.textures.size, models: assets.models.size,
      hdri: assets.hdri.size, buffers: assets.buffers.size,
    };
    step('assets');

    const env = assets.environment('night');
    stage.applyEnvironment(env, { intensity: 0.7, fog: 0x111823 });
    const sky = new NightSky(stage.scene);
    sky.matchFog(stage.fogColor);
    sky.alignToLight(stage.moon);
    step('env');

    const mats = new MaterialLibrary(assets);
    step('materials');

    const t0 = performance.now();
    const level = new Level(stage.scene, mats, assets, preset).build();
    report.levelBuildMs = Math.round(performance.now() - t0);
    report.level = {
      meshes: level.meshes.length,
      colliders: level.collision.boxes.length,
      spawnPoints: level.spawnPoints.length,
      stations: level.stations.length,
      fixtures: level.fixtures.length,
      barrels: level.barrels.length,
      propMeshes: level.props.meshes.length,
      propTris: level.props.triangleCount,
      propKinds: [...level.props.prepared.keys()],
      brokenWindows: level.windowPlacements.length,
    };
    step('level');

    // Nav sanity: can a zombie at each spawn point reach the plaza centre?
    level.flow.compute(0, 0, true);
    report.nav = {
      reachableSpawns: level.spawnPoints.filter(p => level.flow.reachable(p.x, p.z)).length,
      totalSpawns: level.spawnPoints.length,
      distFromNorthSpawn: Math.round(level.flow.distanceAt(0, 45) * 10) / 10,
    };
    step('nav');

    stage.camera.position.set(0, 1.7, 22);
    stage.camera.lookAt(0, 2, 0);
    stage.updateFlashlight(stage.camera, true);

    // Render a burst of frames and time them.
    const times = [];
    for (let i = 0; i < 30; i++) {
      const s = performance.now();
      level.update(0.016, stage.camera.position, i * 0.016);
      sky.update(0.016, i * 0.016, stage.camera.position);
      stage.update(0.016, i * 0.016);
      stage.render();
      times.push(performance.now() - s);
      await new Promise(r => requestAnimationFrame(r));
    }
    times.sort((a,b)=>a-b);
    report.frameMs = {
      median: Math.round(times[15] * 100) / 100,
      p90: Math.round(times[27] * 100) / 100,
    };
    report.draws = stage.drawCalls;
    report.tris = stage.triangles;
    report.programs = stage.renderer.info.programs.length;
    step('render');

    // Keep rendering so the harness can move the camera and grab views.
    const OV = { p: [0, 1.7, 22], t: [0, 2, 0], fl: true };
    const views = [
      OV,                                                   // 0 plaza overview
      { p: [-19, 1.7, -9], t: [-24, 2.2, -14], fl: true },  // 1 brick wall
      { p: [0, 1.7, 30], t: [0, 0.2, 24], fl: true },       // 2 ground closeup
      { p: [-8, 12, -8], t: [0, 1, 0], fl: false },         // 3 high wide
      { p: [-3.4, 1.7, -17.6], t: [-6, 4.6, -20], fl: true },   // 4 street lamp
      { p: [-26, 1.7, -15.2], t: [-26, 1.7, -19.6], fl: true }, // 5 broken windows
      { p: [1.8, 1.5, -14.2], t: [0, 0.4, -17], fl: true },     // 6 cones
      { ...OV, fl: false },                                 // 4 no flashlight
      { ...OV, pools: false },                              // 5 no light pools
      { ...OV, moon: false },                               // 6 no moon
      { ...OV, hemi: false },                               // 7 no hemisphere
      { ...OV, env: false },                                // 8 no IBL
      { ...OV, points: false },                             // 9 no point lights
    ];
    let vi = 0, t = 0;
    window.__setView = (n) => { vi = n; };
    const loop = () => {
      const v = views[vi];
      if (level.lightPoolMesh) level.lightPoolMesh.visible = v.pools !== false;
      stage.moon.visible = v.moon !== false;
      stage.hemi.visible = v.hemi !== false;
      stage.scene.environmentIntensity = v.env === false ? 0 : 0.7;
      for (const e of level._lightPool) e.light.intensity = v.points === false ? 0 : e.light.intensity;
      if (v.points === false) for (const e of level._lightPool) e.light.visible = false;
      stage.camera.position.set(...v.p);
      stage.camera.lookAt(...v.t);
      stage.updateFlashlight(stage.camera, v.fl);
      stage.updateShadowFocus(stage.camera.position, new THREE.Vector3(0,0,-1).applyQuaternion(stage.camera.quaternion));
      t += 0.016;
      level.update(0.016, stage.camera.position, t);
      sky.update(0.016, t, stage.camera.position);
      stage.update(0.016, t);
      stage.render();
      requestAnimationFrame(loop);
    };
    loop();

    report.ok = report.errors.length === 0;
    report.done = true;
  } catch (err) {
    report.errors.push('fatal: ' + (err && err.stack || err));
    report.done = true;
    report.ok = false;
  }
})();
</script>
</body></html>
