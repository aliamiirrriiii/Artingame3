<script type="module">
import * as THREE from 'three';
import { Stage } from '../src/render/stage.js';
import { AssetManager, MANIFEST } from '../src/core/assets.js';
import { MaterialLibrary } from '../src/world/materials.js';
import { Level } from '../src/world/level.js';
import { Sky } from '../src/render/sky.js';
import { Effects } from '../src/render/fx.js';
import { ZombieManager, POSE } from '../src/entities/zombies.js';
import { HITBOX_DEFS } from '../src/entities/hitboxes.js';
import { PRESETS } from '../src/core/quality.js';

const report = { errors: [], steps: [] };
window.__smoke = report;
addEventListener('error', e => report.errors.push('window: ' + e.message));
addEventListener('unhandledrejection', e => report.errors.push('reject: ' + (e.reason?.message || e.reason)));

(async () => {
try {
  const preset = PRESETS[new URLSearchParams(location.search).get('q') || 'medium'];
  const stage = new Stage(document.getElementById('c'), preset);
  stage.resize(960, 540);
  const m = JSON.parse(JSON.stringify(MANIFEST));
  for (const g of ['textures','models','hdri','buffers']) for (const a of m[g]) a.url = '../' + a.url;
  const assets = new AssetManager(stage.renderer);
  await assets.loadAll(m, { anisotropy: preset.anisotropy });
  stage.applyEnvironment(assets.environment('day'), { intensity: 1.25, fog: 0xb9c6d4 });
  const sky = new Sky(stage.scene); sky.matchFog(stage.fogColor); sky.alignToLight(stage.sun);
  const mats = new MaterialLibrary(assets);
  const level = new Level(stage.scene, mats, assets, preset).build();
  const fx = new Effects(stage.scene, assets, preset);
  fx.setCollision(level.collision);
  fx.setFog(stage.fogColor, stage.fogDensity);
  fx.setLighting(stage.lightLevel());
  const zm = new ZombieManager(stage.scene, assets, level, fx, preset);
  report.steps.push('init');

  // A line-up: one of each archetype, spaced out, all walking toward +Z.
  // Out on the north street, clear of the fountain and its colliders.
  const types = ['walker','runner','crawler','brute','spitter','screamer','abomination'];
  types.forEach((t, i) => {
    const z = zm.spawn(t, new THREE.Vector3((i - 3) * 3.4, 0, 30), 1);
    if (z) { z.state = 'pursue'; z.stateT = 1; z.root.position.y = 0; }
  });
  report.spawned = zm.aliveCount;
  report.steps.push('spawn');

  const fakePlayer = { pos: new THREE.Vector3(0, 0, 14), dead: false };
  level.flow.compute(fakePlayer.pos.x, fakePlayer.pos.z, true);

  // Each view also selects an arm-axis candidate, so one run answers which
  // Mixamo local axis actually swings the shoulder forward.
  // Close inspection of the gore: an intact zombie, one with an arm taken off,
  // and one with its head popped, at the distance a player actually kills at.
  // Dismemberment is a bone scaled to nothing, so the only way to know it
  // reads as an amputation and not as a hole in the mesh is to look.
  if (new URLSearchParams(location.search).get('gore') === '1') {
    for (const z of zm.alive.slice()) zm._release(z);
    ['walker', 'walker', 'brute'].forEach((t, i) => {
      const z = zm.spawn(t, new THREE.Vector3((i - 1) * 1.5, 0, 24), 1);
      if (!z) return;
      z.state = 'pursue'; z.stateT = 1;
      zm._frameId++;
      zm._refreshHitboxes(z);
      if (i === 1) zm._sever(z, 'RightForeArm', new THREE.Vector3(1, 0, 0), 1);
      if (i === 2) zm._sever(z, 'Head', new THREE.Vector3(0, 0, -1), 1.6);
    });
    report.gore = zm.alive.map((z) => ({ type: z.type, severed: [...z.severed] }));
  }

  // ------------------------------------------------------- corpse physics
  //
  // A body is a solid object from the moment it dies. Two things have to hold:
  // one thrown at a wall stops at the wall, and a heap of them is a heap of
  // separate bodies rather than one body drawn six times.
  if (new URLSearchParams(location.search).get('physics') === '1') {
    for (const z of zm.alive.slice()) zm._release(z);

    const solid = (x, zz) => level.collision.boxes.some(
      (b) => b.y1 > 0.9 && b.containsXZ(x, zz, -0.05),
    );

    // A wall to throw them at: the tallest box near the middle of the arena.
    let wall = null;
    for (const b of level.collision.boxes) {
      if (b.y1 < 2 || Math.hypot(b.cx, b.cz) > 30) continue;
      if (!wall || b.br > wall.br) wall = b;
    }
    const out = { thrown: 0, inside: 0, wall: wall ? [Math.round(wall.cx), Math.round(wall.cz)] : null };

    if (wall) {
      // Stand them off the wall's local +X face and fire them into it.
      const nx = wall.cos, nz = wall.sin;
      for (let i = 0; i < 5; i++) {
        const px = wall.cx + nx * (wall.hx + 3.2) + (i - 2) * 0.9 * -wall.sin;
        const pz = wall.cz + nz * (wall.hx + 3.2) + (i - 2) * 0.9 * wall.cos;
        if (solid(px, pz)) continue;
        const z = zm.spawn('walker', new THREE.Vector3(px, 0, pz), 1);
        if (!z) continue;
        out.thrown++;
        z.state = 'pursue'; z.stateT = 1;
        z.vel.set(-nx * 11, 0, -nz * 11);
        zm._kill(z, new THREE.Vector3(-nx, 0, -nz), false, true, 'chest', 60, z.pos.clone());
      }
      for (let i = 0; i < 90; i++) zm.update(1 / 60, fakePlayer, i / 60);
      for (const z of zm.alive) {
        if (z.state !== 'dying') continue;
        if (solid(z.pos.x, z.pos.z)) out.inside++;
      }
    }

    // A heap: six killed on the same square metre must not end up stacked.
    for (const z of zm.alive.slice()) zm._release(z);
    const heap = [];
    for (let i = 0; i < 6; i++) {
      const z = zm.spawn('walker', new THREE.Vector3(0.1 * i - 0.25, 0, 30), 1);
      if (!z) continue;
      z.state = 'pursue'; z.stateT = 1;
      z.vel.set(0, 0, 0);
      zm._kill(z, new THREE.Vector3(0, 0, 1), false, true, 'chest', 60, z.pos.clone());
      heap.push(z);
    }
    for (let i = 0; i < 120; i++) zm.update(1 / 60, fakePlayer, i / 60);
    let closest = 99;
    for (let i = 0; i < heap.length; i++) {
      for (let j = i + 1; j < heap.length; j++) {
        closest = Math.min(closest, Math.hypot(heap[i].pos.x - heap[j].pos.x, heap[i].pos.z - heap[j].pos.z));
      }
    }
    out.heap = heap.length;
    out.closest = Math.round(closest * 1000) / 1000;
    report.physics = out;

    if (out.thrown < 3) report.errors.push(`physics: only ${out.thrown} bodies were thrown`);
    if (out.inside > 0) report.errors.push(`physics: ${out.inside} corpses came to rest inside the level`);
    if (out.heap < 5) report.errors.push('physics: the heap never formed');
    if (!(closest > 0.35)) report.errors.push(`physics: corpses stacked — closest pair ${out.closest}m apart`);
  }

  const views = [
    { p: [0, 1.9, 22], t: [0, 1.4, 30], pose: { armEuler: [1, 0, 0], foreEuler: [1, 0.4, 0] } },
    { p: [0, 1.9, 22], t: [0, 1.4, 30], pose: { armEuler: [0, 0, -1], foreEuler: [0, 0.4, -1] } },
    { p: [0, 1.9, 22], t: [0, 1.4, 30], pose: { armEuler: [0, -1, 0], foreEuler: [0, -1, 0.4] } },
    { p: [-6, 1.7, 26], t: [-3.4, 1.5, 30], pose: { armEuler: [1, 0, 0], foreEuler: [1, 0.4, 0] } },
    { p: [0, 12, 16], t: [0, 1, 30], pose: { armEuler: [1, 0, 0], foreEuler: [1, 0.4, 0] } },
  ];
  let vi = 0; window.__setView = n => { vi = n; };
  if (new URLSearchParams(location.search).get('gore') === '1') {
    views[0] = { p: [0, 1.62, 20.4], t: [0, 1.30, 24] };
  }


  // ------------------------------------------------------------ hitbox probe
  //
  // The hitboxes are capsules strung between animated bones, so the only way
  // to know they are where the zombie is *drawn* is to shoot at the bones and
  // see what comes back. Runs once the pose layer has settled.
  const probe = () => {
    const out = { checked: 0, fails: [] };
    const fail = (m) => out.fails.push(m);
    const V = (x, y, z) => new THREE.Vector3(x, y, z);

    for (const z of zm.alive) {
      if (!z.bones.Head) { fail(`${z.type}: no Head bone`); continue; }
      zm._frameId++;                       // force a rebuild for this probe
      zm._refreshHitboxes(z);
      const box = (part, n = 0) => {
        let seen = 0;
        for (let i = 0; i < HITBOX_DEFS.length; i++) {
          if (HITBOX_DEFS[i].part !== part) continue;
          if (seen++ === n) return z.hitboxes[i];
        }
        return null;
      };
      const mid = (hb) => hb.a.clone().lerp(hb.b, 0.5);

      // Straight at the head. This is the whole point of the change.
      const head = box('head');
      const hp = mid(head);
      let hit = zm.raycast(V(hp.x, hp.y, hp.z - 4), V(0, 0, 1), 8, {});
      out.checked++;
      if (!hit || hit.zombie !== z) fail(`${z.type}: head ray missed entirely`);
      else if (hit.part !== 'head') fail(`${z.type}: head ray returned ${hit.part}`);

      // The old static approximation put the head here. If the two agree the
      // pose layer is not being taken into account after all.
      const stat = V(z.pos.x, z.pos.y + z.height * 0.92, z.pos.z);
      out.drift = Math.max(out.drift || 0, stat.distanceTo(hp));

      // Chest from behind. The arm boxes are switched off for this one shot:
      // an arm across the chest is a perfectly good hit, it is just not what
      // this probe is asking about, and whether one is in the way depends on
      // the zombie's random pose phase — which made this check pass or fail by
      // luck rather than by whether the chest capsule is where the chest is.
      for (let j = 0; j < HITBOX_DEFS.length; j++) {
        if (HITBOX_DEFS[j].part === 'arm') z.hitboxes[j].ok = false;
      }
      const cp = mid(box('chest'));
      hit = zm.raycast(V(cp.x, cp.y, cp.z + 4), V(0, 0, -1), 8, {});
      out.checked++;
      if (!hit || hit.zombie !== z) fail(`${z.type}: chest ray missed`);
      else if (hit.part !== 'chest') fail(`${z.type}: chest ray returned ${hit.part}`);

      // A shin, from the front. Nothing else lives at that height.
      const lp = mid(box('leg', 1));
      hit = zm.raycast(V(lp.x, lp.y, lp.z - 4), V(0, 0, 1), 8, {});
      out.checked++;
      if (!hit || hit.zombie !== z) fail(`${z.type}: leg ray missed`);
      else if (hit.part !== 'leg') fail(`${z.type}: leg ray returned ${hit.part}`);

      zm._frameId++;
      zm._refreshHitboxes(z);

      // A forearm, and then the same shot again once it has been taken off.
      // Fired inward from outside the body so the arm is the outermost thing
      // on the line — some archetypes hold theirs across the chest.
      const ap = mid(box('arm', 1));
      const ao = V(ap.x - z.pos.x, 0, ap.z - z.pos.z);
      if (ao.length() < 0.05) ao.set(1, 0, 0);
      ao.normalize();
      const aOrigin = V(ap.x + ao.x * 4, ap.y, ap.z + ao.z * 4);
      const aDir = ao.clone().negate();
      hit = zm.raycast(aOrigin, aDir, 8, {});
      out.checked++;
      if (!hit || hit.part !== 'arm') fail(`${z.type}: forearm ray returned ${hit ? hit.part : 'nothing'}`);

      zm._sever(z, 'LeftForeArm', V(0, 0, 1), 1);
      zm._frameId++;
      hit = zm.raycast(aOrigin, aDir, 8, {});
      out.checked++;
      if (hit && hit.zombie === z && HITBOX_DEFS[hit.box]?.limb === 'LeftForeArm') {
        fail(`${z.type}: severed forearm is still shootable`);
      }
      if (z.bones.LeftForeArm.scale.x > 0.01) fail(`${z.type}: severed bone did not collapse`);
    }
    return out;
  };

  let t = 0, frames = 0; const times = [];
  const loop = () => {
    const dt = 0.016; t += dt; frames++;
    const s = performance.now();
    const v = views[vi];
    if (v.pose) Object.assign(POSE, v.pose);
    stage.camera.position.set(...v.p); stage.camera.lookAt(...v.t);
    stage.updateFlashlight(stage.camera, true);
    stage.updateShadowFocus(stage.camera.position, new THREE.Vector3(0,0,-1).applyQuaternion(stage.camera.quaternion));
    zm.update(dt, fakePlayer, t);
    fx.update(dt);
    level.update(dt, stage.camera.position, t);
    sky.update(dt, t, stage.camera.position);
    stage.update(dt, t);
    stage.render();
    times.push(performance.now() - s);
    if (frames === 20 && !report.gore && !report.physics) report.hitbox = probe();
    if (frames === 24) {
      const so = times.slice().sort((a,b)=>a-b);
      report.frameMs = { median: Math.round(so[12]*100)/100, p90: Math.round(so[21]*100)/100 };
      report.draws = stage.drawCalls; report.tris = stage.triangles;
      report.alive = zm.aliveCount;
      const hb = (report.gore || report.physics)
        ? { fails: [], drift: 1 }
        : (report.hitbox || { fails: ['probe never ran'] });
      if (hb.fails.length) report.errors.push('hitbox: ' + hb.fails.join('; '));
      if (!(hb.drift > 0.03)) {
        report.errors.push(`hitbox: head box sits ${(hb.drift || 0).toFixed(3)}m from the old static guess — it is not following the pose`);
      }
      report.ok = report.errors.length === 0;
      report.done = true;
    }
    requestAnimationFrame(loop);
  };
  loop();
} catch (e) { report.errors.push('fatal: ' + (e && e.stack || e)); report.done = true; report.ok = false; }
})();
</script></body></html>
